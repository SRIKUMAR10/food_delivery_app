# Codemagic configuration for Flutter Food Delivery App
workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1 # Can also use linux instances for Android
    environment:
      flutter: stable
      groups:
        - android_signing_configs # Store: CM_KEYSTORE, CM_KEYSTORE_PASSWORD, etc.
        - api_credentials         # Store: API_BASE_URL, etc.
        - firebase_configs        # Store: FIREBASE_API_KEY, etc.
      vars:
        PACKAGE_NAME: "com.example.food_delivery_app"
    scripts:
      - name: Pre-build - Fetch dependencies
        script: flutter pub get
      - name: Pre-build - Static code analysis
        script: flutter analyze
      - name: Pre-build - Execute unit and widget tests
        script: flutter test
      - name: Build Release APK
        script: flutter build apk --release
      - name: Build Release AAB for Play Store
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab

  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      groups:
        - ios_signing_configs # Store: CERTIFICATE, PROVISIONING_PROFILE, etc.
        - api_credentials
        - firebase_configs
    scripts:
      - name: Pre-build - Fetch dependencies
        script: flutter pub get
      - name: Pre-build - Install CocoaPods
        script: |
          if [ -d "ios" ]; then
            cd ios && pod install && cd ..
          fi
      - name: Pre-build - Static code analysis
        script: flutter analyze
      - name: Pre-build - Execute unit and widget tests
        script: flutter test
      - name: Build iOS Release IPA
        script: |
          # For a signed IPA, configure Code Signing in Codemagic UI or use CLI args
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa

  web-workflow:
    name: Web Workflow
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      groups:
        - api_credentials
        - firebase_configs
    scripts:
      - name: Pre-build - Fetch dependencies
        script: flutter pub get
      - name: Pre-build - Static code analysis
        script: flutter analyze
      - name: Pre-build - Execute unit and widget tests
        script: flutter test
      - name: Build Web Release
        script: |
          # Enables web if not already enabled
          flutter config --enable-web
          flutter build web --release
    artifacts:
      - build/web/**

  windows-workflow:
    name: Windows Workflow
    max_build_duration: 60
    instance_type: windows_full # Required for Windows native builds
    environment:
      flutter: stable
      groups:
        - api_credentials
        - firebase_configs
    scripts:
      - name: Pre-build - Fetch dependencies
        script: flutter pub get
      - name: Pre-build - Static code analysis
        script: flutter analyze
      - name: Pre-build - Execute unit and widget tests
        script: flutter test
      - name: Build Windows Release
        script: |
          # Enables windows if not already enabled
          flutter config --enable-windows-desktop
          flutter build windows --release
    artifacts:
      - build/windows/runner/Release/**

publishing:
  # You can configure automated deployment to stores here
  email:
    recipients:
      - user@example.com
    notifying:
      on_build_start: false
      on_success: true
      on_failure: true